<!doctype html>
<!--
  The roadmap picture in the README is a screenshot of this page.

  To change the roadmap, edit ROADMAP below, then run `npm run roadmap`.
  It saves docs/images/roadmap.png (English) and docs/images/roadmap.zh-CN.png.
  To look at it while you edit: `npm run dev`, then open /docs/roadmap.html
  (add ?lang=zh for Chinese).
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1200" />
    <link rel="icon" type="image/svg+xml" href="../public/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Block Anatomy Roadmap</title>
    <style>
      :root {
        --paper: #e7e6e1;
        --card: #fdfcf7;
        --ink: #1f2a5c;
        --ink-soft: #5d668c;
        --line: #cfcbc3;
        --pink: #f0719f;
        --blue: #6fb8ec;
        --green: #a9dd78;
        --sun: #ffd84d;
        --cjk: 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', 'Microsoft YaHei';
        --display: 'Fredoka', 'Nunito', var(--cjk), system-ui, sans-serif;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; background: var(--paper); }
      body {
        font-family: 'Nunito', var(--cjk), system-ui, sans-serif;
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
      }

      /* The board is exactly what the screenshot captures: 1200 × 860. */
      .board {
        position: relative;
        width: 1200px;
        height: 860px;
        padding: 44px 48px 36px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        background:
          radial-gradient(circle at 1px 1px, rgba(31, 42, 92, 0.09) 1px, transparent 0) 0 0 / 22px 22px,
          var(--paper);
      }

      header { display: flex; align-items: flex-end; justify-content: space-between; }
      .brand { display: flex; align-items: center; gap: 18px; }
      .brand svg { width: 64px; height: 64px; flex: none; }
      .kicker {
        font: 600 15px/1 var(--display);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--ink-soft);
      }
      h1 { margin: 6px 0 0; font: 600 44px/1 var(--display); }
      .subtitle { margin: 0 0 4px; font-size: 17px; color: var(--ink-soft); font-weight: 600; }

      main {
        flex: 1;
        margin-top: 26px;
        display: flex;
        flex-direction: column;
        gap: 26px;
        min-height: 0;
      }
      h2 { margin: 0; font: 600 21px/1 var(--display); }

      /* ── Today: what already ships ── */
      .today {
        border: 2.5px dashed var(--line);
        border-radius: 20px;
        padding: 20px 26px 22px;
        background: rgba(253, 252, 247, 0.6);
      }
      .today-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
      .today h2 { color: var(--ink-soft); }
      .stats { display: flex; gap: 10px; }
      .stat {
        display: flex; align-items: baseline; gap: 7px;
        padding: 5px 13px 6px;
        border-radius: 12px;
        background: var(--card);
        border: 2px solid var(--line);
      }
      .stat b { font: 600 22px/1 var(--display); }
      .stat span { font-size: 13.5px; font-weight: 700; color: var(--ink-soft); }
      .groups { display: grid; grid-template-columns: repeat(4, 1fr); gap: 26px; }
      .group h3 {
        margin: 0 0 11px;
        font: 600 16.5px/1 var(--display);
        display: flex; align-items: center; gap: 8px;
      }
      .group ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
      .group li { display: flex; gap: 9px; font-size: 14.5px; line-height: 1.3; font-weight: 700; }
      .group li small { display: block; margin-top: 2px; font-size: 13px; font-weight: 600; color: var(--ink-soft); }
      .tick {
        flex: none; width: 18px; height: 18px; border-radius: 6px; margin-top: 0.5px;
        background: var(--ink-soft); color: var(--card);
        display: grid; place-items: center; font-size: 12px; font-weight: 800;
      }

      .next { flex: 1; display: flex; flex-direction: column; gap: 14px; min-height: 0; }
      .next h2 { padding-left: 4px; }

      /* ── What we plan to build: a plain list of cards, in no particular order ── */
      .plans { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; }
      .plan { display: flex; flex-direction: column; min-height: 0; }

      .card {
        flex: 1;
        background: var(--card);
        border: 2.6px solid var(--ink);
        border-radius: 20px;
        box-shadow: 5px 5px 0 var(--ink);
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      .card .band {
        height: 14px;
        background: var(--c);
        border-bottom: 2.6px solid var(--ink);
      }
      .card .body { padding: 18px 20px 20px; display: flex; flex-direction: column; flex: 1; }
      .card h3 { margin: 0; font: 600 26px/1.1 var(--display); display: flex; align-items: center; gap: 10px; }
      .card h3 .icon { font-size: 26px; }
      .card p { margin: 10px 0 0; font-size: 15.5px; line-height: 1.45; color: var(--ink-soft); font-weight: 600; }
      .card ul { margin: 16px 0 0; padding: 0; list-style: none; display: grid; gap: 9px; }
      .card li { display: flex; gap: 10px; font-size: 15px; line-height: 1.35; font-weight: 700; }
      .card li::before {
        content: '';
        flex: none;
        width: 12px; height: 12px; margin-top: 4px;
        border-radius: 4px;
        border: 2px solid var(--ink);
        background: var(--c);
      }
      .chips { margin-top: auto; padding-top: 16px; display: flex; flex-wrap: wrap; gap: 7px; }
      .chips span {
        font-size: 13.5px; font-weight: 800;
        padding: 4px 11px;
        border-radius: 999px;
        border: 2px solid var(--ink);
        background: color-mix(in srgb, var(--c) 35%, var(--card));
      }
      .note {
        margin-top: auto; padding-top: 14px;
        font-size: 13.5px; font-weight: 700; color: var(--ink-soft);
        font-style: italic;
      }
      .chips + .note { margin-top: 0; padding-top: 10px; }

      footer {
        margin-top: 22px;
        display: flex; justify-content: space-between;
        font-size: 13.5px; font-weight: 700; color: var(--ink-soft);
      }
    </style>
  </head>
  <body>
    <div class="board" id="board"></div>

    <script>
      /*
       * The roadmap. Each card is a real feature we plan to build. It is a list, not steps: no numbers, no order.
       * Every string has an English and a Chinese version: { en, zh }.
       */
      const ROADMAP = {
        kicker: { en: 'Block Anatomy', zh: 'Block Anatomy 方块解剖' },
        title: { en: 'Roadmap', zh: '路线图' },
        subtitle: { en: 'What the app has, and what comes next', zh: '已经有的，和接下来要做的' },

        // What already ships. Keep it true: only what a user can open in the app today.
        today: {
          title: { en: 'In the app today', zh: '现在已有' },
          stats: [
            { n: '5', label: { en: 'body parts', zh: '个身体部位' } },
            { n: '40', label: { en: 'muscle blocks', zh: '块肌肉' } },
            { n: '5', label: { en: 'classic poses', zh: '个经典姿势' } },
          ],
          groups: [
            {
              icon: '🦴',
              title: { en: 'Body parts', zh: '身体部位' },
              items: [
                { en: 'Arm', zh: '手臂', sub: { en: 'upper arm · forearm', zh: '上臂 · 前臂' } },
                { en: 'Hand and foot', zh: '手和脚' },
                { en: 'Leg', zh: '腿', sub: { en: 'thigh · lower leg', zh: '大腿 · 小腿' } },
                { en: 'Torso', zh: '躯干', sub: { en: 'front · back', zh: '正面 · 背面' } },
                { en: 'Sculpted bones inside', zh: '里面有雕刻的骨骼' },
              ],
            },
            {
              icon: '🕺',
              title: { en: 'Move and pose', zh: '动作与姿势' },
              items: [
                { en: 'Sliders for every joint', zh: '每个关节都有滑块' },
                { en: 'One-tap poses, like Flex!', zh: '一键姿势，比如“秀肌肉！”' },
                {
                  en: 'Full male figure',
                  zh: '男性全身人体',
                  sub: {
                    en: 'Contrapposto · The Thinker · Discus thrower · Spear thrower · Double biceps',
                    zh: '对立式平衡 · 思想者 · 掷铁饼者 · 投矛者 · 双肱二头肌',
                  },
                },
                { en: 'Left or right · male or female', zh: '左或右 · 男或女' },
              ],
            },
            {
              icon: '📖',
              title: { en: 'Study', zh: '学习' },
              items: [
                {
                  en: 'Muscle notes',
                  zh: '肌肉说明',
                  sub: { en: 'where it runs · how to draw it · what to watch', zh: '位置 · 怎么画 · 观察什么' },
                },
                {
                  en: 'Show or hide',
                  zh: '显示 / 隐藏',
                  sub: { en: 'muscles · bones · guide lines · labels · neighbours', zh: '肌肉 · 骨架 · 辅助线 · 标签 · 相邻肌肉' },
                },
                { en: 'A link for every part', zh: '每个部位都有链接' },
              ],
            },
            {
              icon: '💡',
              title: { en: 'View and light', zh: '视角与光线' },
              items: [
                { en: 'Spin, pan and zoom', zh: '旋转、平移、缩放' },
                { en: 'View gizmo', zh: '视图球', sub: { en: 'any side · tilt the picture', zh: '任意一面 · 倾斜画面' } },
                { en: 'Plaster-cast light', zh: '石膏像光线', sub: { en: 'Top · Side · Rim · lock light', zh: '顶光 · 侧光 · 轮廓光 · 锁定光线' } },
                { en: 'Phones and tablets too', zh: '手机和平板也能用' },
              ],
            },
          ],
        },

        next: { en: 'Coming next', zh: '接下来' },

        plans: [
          {
            color: 'var(--pink)',
            icon: '🗿',
            title: { en: 'A new head', zh: '全新的头部' },
            text: {
              en: 'A new head for the figure, built the same block way as the rest of the body.',
              zh: '给人体换一个新的头部，和身体其他部分一样用方块来搭。',
            },
            items: [
              { en: 'Skull, jaw and face as clear blocks', zh: '颅骨、下颌和面部各自成块' },
              { en: 'Draw the head from any angle', zh: '从任何角度练习画头' },
            ],
          },
          {
            color: 'var(--blue)',
            icon: '🚺',
            title: { en: 'The female body', zh: '女性身体' },
            text: {
              en: 'Her own bones and muscles, not the male body reshaped.',
              zh: '女性自己的骨骼和肌肉，而不是把男性身体改一改。',
            },
            items: [
              { en: 'Female bones: wider pelvis, smaller rib cage', zh: '女性骨骼：更宽的骨盆，更小的胸廓' },
              { en: 'Female muscle blocks on every part', zh: '每个部位都有女性肌肉块' },
              { en: 'A full-body female figure with the same poses', zh: '全身女性人体，同样的姿势' },
            ],
          },
          {
            color: 'var(--green)',
            icon: '🔍',
            title: { en: 'Sharper anatomy', zh: '更清晰的解剖' },
            text: {
              en: 'Rebuild every part, one at a time, so each block is cleaner and easier to read.',
              zh: '一个部位一个部位地重做，让每个块更干净、更好懂。',
            },
            chips: [
              { en: 'Arm', zh: '手臂' },
              { en: 'Hand', zh: '手' },
              { en: 'Torso', zh: '躯干' },
              { en: 'Leg', zh: '腿' },
              { en: 'Foot', zh: '脚' },
            ],
            note: { en: 'Not more medical. Easier to understand.', zh: '不是更医学，而是更好懂。' },
          },
        ],

        footer: {
          left: { en: 'anatomy-blocks.vercel.app', zh: 'anatomy-blocks.vercel.app' },
          right: { en: 'Made for people who love to draw', zh: '为爱画画的人而做' },
        },
      }

      // ── render ──
      const lang = new URLSearchParams(location.search).get('lang') === 'zh' ? 'zh' : 'en'
      document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en'
      const t = (s) => s[lang]
      const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])
      const tx = (s) => esc(t(s))

      const logo = `
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <g stroke="#1f2a5c" stroke-width="2.6" stroke-linejoin="round">
            <rect x="15" y="5" width="20" height="13" rx="4" fill="#f0719f" transform="rotate(-8 25 11)"/>
            <rect x="12" y="17.5" width="20" height="13" rx="4" fill="#6fb8ec" transform="rotate(6 22 24)"/>
            <rect x="16" y="30" width="20" height="13" rx="4" fill="#a9dd78" transform="rotate(-5 26 36)"/>
          </g>
        </svg>`

      const group = (g) => `
        <div class="group">
          <h3><span>${g.icon}</span>${tx(g.title)}</h3>
          <ul>${g.items
            .map((x) => `<li><span class="tick">✓</span><div>${tx(x)}${x.sub ? `<small>${tx(x.sub)}</small>` : ''}</div></li>`)
            .join('')}</ul>
        </div>`

      const plan = (s) => `
        <section class="plan" style="--c:${s.color}">
          <article class="card">
            <div class="band"></div>
            <div class="body">
              <h3><span class="icon">${s.icon}</span>${tx(s.title)}</h3>
              <p>${tx(s.text)}</p>
              ${s.items ? `<ul>${s.items.map((x) => `<li>${tx(x)}</li>`).join('')}</ul>` : ''}
              ${s.chips ? `<div class="chips">${s.chips.map((x) => `<span>${tx(x)}</span>`).join('')}</div>` : ''}
              ${s.note ? `<div class="note">${tx(s.note)}</div>` : ''}
            </div>
          </article>
        </section>`

      document.getElementById('board').innerHTML = `
        <header>
          <div class="brand">
            ${logo}
            <div>
              <div class="kicker">${tx(ROADMAP.kicker)}</div>
              <h1>${tx(ROADMAP.title)}</h1>
            </div>
          </div>
          <p class="subtitle">${tx(ROADMAP.subtitle)}</p>
        </header>
        <main>
          <section class="today">
            <div class="today-head">
              <h2>${tx(ROADMAP.today.title)}</h2>
              <div class="stats">${ROADMAP.today.stats.map((x) => `<div class="stat"><b>${x.n}</b><span>${tx(x.label)}</span></div>`).join('')}</div>
            </div>
            <div class="groups">${ROADMAP.today.groups.map(group).join('')}</div>
          </section>
          <section class="next">
            <h2>${tx(ROADMAP.next)}</h2>
            <div class="plans">${ROADMAP.plans.map(plan).join('')}</div>
          </section>
        </main>
        <footer><span>${tx(ROADMAP.footer.left)}</span><span>${tx(ROADMAP.footer.right)}</span></footer>`
    </script>
  </body>
</html>
