<svg xmlns="http://www.w3.org/2000/svg" width="260" height="42" viewBox="0 0 260 42" role="img" aria-label="Language: English (current) or 简体中文">
  <!-- button 1: English, current, yellow -->
  <rect x="4" y="6" width="124" height="34" rx="17" fill="#1f2a5c"/>
  <rect x="2" y="4" width="124" height="34" rx="17" fill="#ffd84d" stroke="#1f2a5c" stroke-width="2"/>
  <text x="64" y="26" text-anchor="middle" font-family="Nunito, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="800" fill="#1f2a5c">English</text>

  <!-- button 2: 简体中文, cream -->
  <rect x="136" y="6" width="124" height="34" rx="17" fill="#1f2a5c"/>
  <rect x="134" y="4" width="124" height="34" rx="17" fill="#fdfcf7" stroke="#1f2a5c" stroke-width="2"/>
  <text x="196" y="26" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', 'Microsoft YaHei', system-ui, sans-serif" font-size="15" font-weight="800" fill="#1f2a5c">简体中文</text>
</svg>
